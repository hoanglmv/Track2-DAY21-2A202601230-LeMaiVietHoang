name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage (AWS / GCP), pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import os, json

          cred = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          try:
              data = json.loads(cred)
              if "aws_access_key_id" in data or "AWS_ACCESS_KEY_ID" in data:
                  key_id = data.get("aws_access_key_id") or data.get("AWS_ACCESS_KEY_ID")
                  secret = data.get("aws_secret_access_key") or data.get("AWS_SECRET_ACCESS_KEY")
                  region = data.get("aws_default_region") or data.get("AWS_DEFAULT_REGION", "us-east-1")
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
                      f.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
                      f.write(f"AWS_DEFAULT_REGION={region}\n")
                  print("Xac thuc thanh cong bang AWS Credentials.")
              else:
                  with open("/tmp/sa-key.json", "w") as f:
                      f.write(cred)
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
                  print("Xac thuc thanh cong bang GCP Service Account.")
          except Exception:
              with open("/tmp/sa-key.json", "w") as f:
                  f.write(cred)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
              print("Mac dinh su dung GCP Service Account.")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          model_file = "models/model.joblib"
          key = "artifacts/current/model.joblib"

          if "AWS_ACCESS_KEY_ID" in os.environ:
              import boto3
              s3 = boto3.client("s3")
              s3.upload_file(model_file, bucket_name, key)
              print(f"Uploaded {model_file} to s3://{bucket_name}/{key}")
          else:
              from google.cloud import storage
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob(key)
              blob.upload_from_filename(model_file)
              print(f"Uploaded {model_file} to gs://{bucket_name}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys

          f1_val = "${{ needs.train.outputs.f1 }}"
          try:
              f1 = float(f1_val)
          except Exception as e:
              sys.exit(f"FAILED: Khong doc duoc gia tri f1 ({f1_val}): {e}")

          print(f"Quality Gate Check - Current F1-Score: {f1:.4f} (Threshold: 0.65)")
          if f1 < 0.65:
              sys.exit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: f1_score >= 0.65. Cho phep trien khai len production.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
